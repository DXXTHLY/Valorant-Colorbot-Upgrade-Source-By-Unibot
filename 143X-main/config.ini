; 143X Colorbot Configuration File
; Upgraded by DXXTHLY — https://github.com/dxxthly
; Originally based on Unibot — https://github.com/vike256/Unibot
; Consider donating to vike256: https://github.com/vike256#donate

[communication]
; Select input method: 'none' = WinAPI, 'driver' = Interception, 
; 'serial' = Arduino COM port, 'socket' = microcontroller over Wi-Fi or Ethernet
type = none

; Required only for 'serial' or 'socket' types
ip = 0.0.0.0
port = 50124
com_port = COM1

[screen]
; Pixel detection threshold for triggering action (X, Y)
detection_threshold = 3, 3

; HSV color range for detecting enemy colors
upper_color = 63, 255, 255
lower_color = 58, 210, 80

; General field-of-view for scanning and aiming
fov_x = 256
fov_y = 256
aim_fov_x = 256
aim_fov_y = 256

; Performance settings
fps = 60  ; Max screenshots per second (do not exceed monitor refresh rate)
auto_detect_resolution = true
resolution_x = 1920
resolution_y = 1080

[aim]
offset = 0           ; Horizontal aim offset (positive = right)
smooth = 0.0         ; Smoothing value (0 = instant snap)
speed = 1.0          ; Aim speed multiplier
y_speed = 1.0        ; Vertical speed multiplier (for recoil compensation)
aim_height = 0.5     ; Adjust vertical aim target zone (0.0 = bottom, 1.0 = top)

[recoil]
mode = move          ; Recoil compensation mode: 'move' or 'offset'
recoil_x = 0.0       ; Horizontal recoil compensation per shot
recoil_y = 0.0       ; Vertical recoil compensation per shot
max_offset = 100     ; Max total pixel movement for recoil
recover = 0.0        ; Recovery rate (optional)

[trigger]
trigger_delay = 0            ; Static delay before shooting
trigger_randomization = 30   ; Adds up to this many ms randomly to the delay
trigger_threshold = 8        ; Minimum brightness difference to register a trigger

[rapid_fire]
target_cps = 10              ; Clicks per second for semi-auto weapons

[key_binds]
; Virtual key codes: https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
key_reload_config = 0x70     ; F1 - Reload config
key_toggle_aim = 0x71        ; F2 - Toggle aim
key_toggle_recoil = 0x72     ; F3 - Toggle recoil control
key_exit = 0x73              ; F4 - Exit bot
key_trigger = 0x06           ; Mouse4 - Triggerbot
key_rapid_fire = 0x05        ; Mouse5 - Rapid-fire
aim_keys = 0x01, 0x02        ; Mouse1 & Mouse2 - Keys that enable aiming

[debug]
enabled = true               ; Show debug overlay
always_on = true             ; Refresh debug even if cheats are disabled
display_mode = mask          ; Options: 'game' (raw screen) or 'mask' (detected pixels)
